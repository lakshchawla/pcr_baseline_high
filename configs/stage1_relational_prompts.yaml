# Stage 1: per-identity, per-branch CLIP prompt learning -- CLIP-ReID's Stage 1 extended to K
# body-part branches (see examples/train_relational_prompts.py's docstring). Image encoder:
# ClipRN50BPAMEncoder (CLIP's frozen RN50 + Stage 0's pixel classifier), branch 0 = CLIP's own
# global x_proj, 1..K = mask-pooled part_xproj (MaskCLIP dense projection -- see
# pcr/models/clip_dense_part_encoder.py). Text: ctx -> template -> frozen CLIP text encoder, no
# mixing block. Run examples/cache_text_anchors.py against this same config afterward.
#
# clip.arch must match the image tower's checkpoint: image and text towers must come from the
# SAME CLIP checkpoint or they aren't in one joint space (pcr/models/clip_rn50_bpam_encoder.py).

model:
  # Stage 0's trained pixel-classifier checkpoint (state dict key 'pixel_classifier') -- NOT a
  # full BPBreID/ViT checkpoint.
  checkpoint_path: 'examples/logs/stage0_bpa_rn50/model_best.pth.tar'
  dim_reduce_output: 1024    # RN50's own embed_dim -- must equal clip.arch's text embed dim
  parts_num: 5                # K body parts; num_branches = 1 + parts_num

clip:
  arch: RN50
  n_ctx: 4                    # learnable context tokens per (identity, branch) -- CLIP-ReID's value

part_diag:
  # L_part_diag (pcr/loss/part_diag_loss.py): image part k vs the SAME person's K part prompts,
  # and the reverse -- the within-identity negatives SupCon never sees. Measured before this
  # existed: same-identity different-part prompt cosine 0.98 (parts collapsed into one identity
  # vector). On from epoch 0; each direction is bounded by log K = 1.6 vs SupCon's ~100 at start.
  warmup_fraction: 0.0
  ramp_fraction: 0.1
  lambda_max: 1.0
  temperature: 0.05     # fixed: within-person cosines are all high, so this needs to be sharp
                        # and shouldn't be coupled to SupCon's 751-identity-pool temperature

data:
  dataset: market1501         # or dukemtmc-reid
  data_dir: ../datasets
  height: 384
  width: 128
  batch_size: 32               # PK batch per SupCon step (multiple of num_instances)
  num_instances: 4             # batch_size // num_instances identities per batch
  cache_batch_size: 32         # for the one-off full-dataset feature-caching pass
  workers: 4

optim:
  # PyYAML needs a decimal point for scientific notation to parse as a float, so small values
  # are written in plain decimal.
  lr: 0.00035                  # CLIP-ReID's own Stage 1 value
  weight_decay: 0.0001
  epochs: 120
  warmup_epochs: 5
  warmup_lr_init: 0.00001
  lr_min: 0.000001

loss:
  # Initial value only -- SupConLoss's temperature is learnable and logged every epoch. 0.1, not
  # CLIP-ReID's 1.0: this loss compares against the full training set every step and needs a
  # sharper start at that scale.
  temperature: 0.1

logging:
  logs_dir: examples/logs/stage1_prompts_clip_rn50
  print_freq: 10
  seed: 1
