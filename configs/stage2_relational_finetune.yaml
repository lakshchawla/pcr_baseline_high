# Stage 2: supervised backbone finetune -- CLIP-ReID's Stage 2 (its RN50 recipe:
# ../CLIP-ReID/configs/person/cnn_clipreid.yml) extended to K body-part branches; see
# examples/train_relational_finetune.py's docstring for the loss composition. Reads Stage 1's
# text_prototypes.pth (stage1.prompt_dir) as the frozen alignment target. Retrieval matches on
# the joint-space branches [x_proj, part_xproj] with visibility-aware part-wise distance.

model:
  # Stage 0's trained pixel-classifier checkpoint (state dict key 'pixel_classifier') -- the same
  # one Stage 1 used; NOT a full BPBreID/ViT checkpoint.
  checkpoint_path: 'examples/logs/stage0_bpa_rn50/model_best.pth.tar'
  dim_reduce_output: 1024    # RN50's own embed_dim -- must match stage1 and clip.arch's text dim
  parts_num: 5

clip:
  arch: RN50                    # must match stage1's clip.arch (same CLIP checkpoint, both towers)

stage1:
  prompt_dir: examples/logs/stage1_prompts_clip_rn50   # where text_prototypes.pth is read from

data:
  dataset: market1501         # or dukemtmc-reid
  data_dir: ../datasets
  height: 384
  width: 128
  batch_size: 64               # CLIP-ReID's RN50 recipe: 64 = P16 x K4 (measured 2 GB at 32 on
  num_instances: 4             # the 8 GB card at 384x128, so 64 fits)
  workers: 4
  # BPA supervision. Market1501's real masks; DukeMTMC-reID has none -- set masks_dir: '' there
  # and the BPA term is skipped.
  masks_dir: pifpaf_maskrcnn_filtering
  masks_suffix: '.npy'

loss:
  id_weight: 1.0                # CLIP-ReID: ID 1.0, TRIPLET 1.0, I2T 1.0
  triplet_weight: 1.0
  triplet_margin: 0.3
  triplet_visibility_min: 0.05  # loose hard exclusion for the part-based triplet's mining only
  align_weight: 1.0             # CLIP-ReID's I2T weight (was 0.5)
  align_temperature: 0.07       # cosine / T against the full prototype table (rows unit-norm)
  bpa_weight_initial: 1.0       # cosine decay to the floor over decay_epochs -- the classifier
  bpa_weight_floor: 0.15        # starts converged (Stage 0), so this is a tether, not training
  bpa_weight_decay_epochs: 20

optim:
  # CLIP-ReID's RN50 Stage 2 recipe: Adam, 3.5e-4, wd 5e-4, 120 epochs, x0.1 at 40 and 70,
  # 10-epoch linear warmup from 0.01x. (5e-6 -- the value this file carried before -- is
  # CLIP-ReID's ViT recipe; on RN50 it trained the backbone ~70x too slowly: 75.9 mAP.)
  lr: 0.00035
  weight_decay: 0.0005
  epochs: 120
  milestones: [40, 70]
  warmup_epochs: 10
  warmup_factor: 0.01

vit:
  llrd_decay: 0.75             # ViT only: layer-wise LR decay + longer warmup (see build_optimizer)
  warmup_epochs: 20

eval:
  # How the M per-part distances collapse into one, at retrieval AND inside the part triplet's
  # mining (pcr/utils/part_distance.py::combine_part_distances). 'mean' is BPBReID's default and
  # averages a single disagreeing part away (two people in all black, different shoes -> still
  # "similar"). 'lse' is a visibility-weighted log-sum-exp = soft-max of part distances = soft-min
  # of part similarities: every part's disagreement enters weighted by exp(d/T), so one part whose
  # similarity collapses drags the pair's score with it. T -> inf is the mean, T -> 0 the hard max;
  # on unit-norm features (d in [0,2], between-part gaps ~0.1-0.5) T=0.2 makes a 0.3 gap count
  # ~4.5x. The evaluator logs the plain mean alongside every eval for comparison.
  part_combine: lse
  lse_temperature: 0.2

logging:
  logs_dir: examples/logs/stage2_finetune_clip_rn50
  print_freq: 10
  eval_step: 10
  seed: 1
